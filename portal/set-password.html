<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<title>Set Your Password — MD Scholars</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  :root { --navy: #001F3F; --teal: #134E4A; --teal-bright: #0d9488; --teal-light: #14b8a6; --cream: #f8f5ef; --white: #ffffff; --gray-200: #e2e8f0; --gray-400: #94a3b8; --gray-600: #475569; --text: #0f172a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: var(--white); border-radius: 16px; padding: 2.5rem; max-width: 460px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .brand { text-align: center; margin-bottom: 1.5rem; }
  .brand-icon { width: 56px; height: 56px; margin: 0 auto 1rem; background: linear-gradient(135deg, var(--teal), var(--teal-bright)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; }
  .brand h1 { font-family: 'Newsreader', serif; font-size: 1.4rem; color: var(--navy); }
  .brand .subtitle { font-size: 0.78rem; color: var(--gray-600); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.25rem; }
  h2 { font-family: 'Newsreader', serif; font-size: 1.5rem; color: var(--navy); margin-bottom: 0.5rem; }
  .hint { color: var(--gray-600); font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.5; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--navy); margin-bottom: 0.4rem; }
  .field input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
  .field input:focus { outline: none; border-color: var(--teal-bright); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
  .submit { width: 100%; background: linear-gradient(135deg, var(--teal-bright), var(--teal-light)); color: var(--white); padding: 0.85rem 1rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 0.5rem; }
  .submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
  .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .msg.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .req { font-size: 0.8rem; color: var(--gray-600); margin-top: 0.5rem; }
</style>
  <style id="mds-lucide-style">
.mds-lu { display: inline-block; width: 1.05em; height: 1.05em; stroke-width: 1.75; vertical-align: -0.18em; margin-right: 0.4em; color: currentColor; flex-shrink: 0; }
.mds-lu:last-child { margin-right: 0; }
.feature-icon .mds-lu, .service-icon .mds-lu, .stat-icon .mds-lu,
.card-icon .mds-lu, .program-icon .mds-lu, .step-icon .mds-lu,
.trust-icon .mds-lu, .cta-icon .mds-lu, .icon-badge .mds-lu,
.tab-icon .mds-lu, .nav-item-icon .mds-lu { width: 60%; height: 60%; margin: 0; stroke-width: 1.5; }
</style>
  <style id="mds-canonical-contrast">
/* ═══ CONTRAST FIX — light icons/buttons on dark surfaces ═══ */

/* Icons on dark surfaces (nav, footer, dark hero, CTA bands, dashboard sidebar) render white */
body > nav .mds-lu,
body > footer .mds-lu,
body footer .mds-lu,
body .hero .mds-lu,
body .hero-section .mds-lu,
body section.section-navy .mds-lu,
body section.dark .mds-lu,
body section[class*="cta"] .mds-lu,
body [class*="dark-bg"] .mds-lu,
body [class*="bg-navy"] .mds-lu,
body [class*="bg-dark"] .mds-lu,
body [style*="background:#001F3F" i] .mds-lu,
body [style*="background: #001F3F" i] .mds-lu,
body [style*="background-color:#001F3F" i] .mds-lu,
body [style*="background:var(--navy)" i] .mds-lu,
body [style*="background: var(--navy)" i] .mds-lu,
body [style*="background:var(--navy-mid)" i] .mds-lu,
body [style*="background:#0f172a" i] .mds-lu,
body [style*="background: #0f172a" i] .mds-lu,
body [style*="background:#001a35" i] .mds-lu,
body [style*="background:#002d5a" i] .mds-lu,
body .sidebar .mds-lu,
body .dashboard-sidebar .mds-lu,
body aside.dark .mds-lu {
  color: #ffffff !important;
  stroke: #ffffff !important;
}

/* Icon container circles on dark surfaces need light backgrounds */
body > footer .feature-icon, body > footer .service-icon, body > footer .card-icon,
body > footer .program-icon, body > footer .step-icon, body > footer .stat-icon,
body > footer .trust-icon, body > footer .icon-badge, body > footer .cta-icon,
body .hero .feature-icon, body .hero .service-icon, body .hero .card-icon,
body .hero .program-icon, body .hero .step-icon, body .hero .stat-icon,
body .hero .trust-icon, body .hero .icon-badge, body .hero .cta-icon,
body section.section-navy .feature-icon, body section.dark .feature-icon,
body section[class*="cta"] .feature-icon,
body [class*="dark-bg"] .feature-icon, body [class*="dark-bg"] .stat-icon,
body [class*="bg-navy"] .feature-icon, body [class*="bg-navy"] .stat-icon {
  background: rgba(255, 255, 255, 0.12) !important;
  color: #ffffff !important;
  border: 1px solid rgba(255, 255, 255, 0.18) !important;
}
body > footer .feature-icon .mds-lu,
body > footer .service-icon .mds-lu,
body .hero .feature-icon .mds-lu,
body .hero .stat-icon .mds-lu,
body section.section-navy .feature-icon .mds-lu,
body [class*="dark-bg"] .feature-icon .mds-lu {
  color: #ffffff !important;
  stroke: #ffffff !important;
}

/* Buttons — ensure primary CTAs always readable */
body .btn-primary, body a.btn-primary, body button.btn-primary,
body .btn-teal, body a.btn-teal, body button.btn-teal,
body .btn-cta, body a.btn-cta, body button.btn-cta,
body .cta-button, body a.cta-button, body button.cta-button {
  background: #0d9488 !important;
  color: #ffffff !important;
  border: 1px solid #0d9488 !important;
}
body .btn-primary .mds-lu, body .btn-teal .mds-lu, body .btn-cta .mds-lu {
  color: #ffffff !important;
  stroke: #ffffff !important;
}

/* Ghost / outline buttons on DARK surfaces — light border + light text */
body > nav .btn-ghost, body > nav a.btn-ghost, body > nav button.btn-ghost,
body > footer .btn-ghost, body > footer a.btn-ghost, body > footer button.btn-ghost,
body .hero .btn-ghost, body .hero a.btn-ghost, body .hero button.btn-ghost,
body section.section-navy .btn-ghost,
body section[class*="cta"] .btn-ghost,
body [class*="dark-bg"] .btn-ghost, body [class*="bg-navy"] .btn-ghost {
  background: rgba(255, 255, 255, 0.05) !important;
  color: #ffffff !important;
  border: 1.5px solid rgba(255, 255, 255, 0.55) !important;
  backdrop-filter: blur(4px);
}
body > nav .btn-ghost:hover, body > footer .btn-ghost:hover, body .hero .btn-ghost:hover,
body section.section-navy .btn-ghost:hover, body [class*="dark-bg"] .btn-ghost:hover {
  background: rgba(255, 255, 255, 0.14) !important;
  color: #ffffff !important;
  border-color: rgba(255, 255, 255, 0.85) !important;
}

/* Nav links / footer links — text is already white but ensure inline icons are too */
body > nav a .mds-lu, body > nav a i, body > footer a .mds-lu {
  color: currentColor !important;
  stroke: currentColor !important;
}

/* Any text-in-hero elements that were dark by inheritance */
body .hero h1, body .hero h2, body .hero p, body .hero .hero-sub,
body section.section-navy h1, body section.section-navy h2, body section.section-navy p,
body section.section-navy .section-title {
  color: #ffffff !important;
}
body .hero .section-label, body section.section-navy .section-label {
  color: #14b8a6 !important;
  border-bottom-color: #c9a84c !important;
}

/* Trust pills / feature pills on dark backgrounds */
body .hero .trust-pill, body .hero .feature-pill,
body section.section-navy .trust-pill, body section.section-navy .feature-pill,
body [class*="dark-bg"] .trust-pill {
  background: rgba(255, 255, 255, 0.08) !important;
  color: #ffffff !important;
  border-color: rgba(255, 255, 255, 0.18) !important;
}
body .hero .trust-pill::before, body section.section-navy .trust-pill::before {
  color: #14b8a6 !important;
}

/* Cards that sit on a dark section (uncommon but happens) */
body section.section-navy .card, body section.section-navy .feature-card,
body [class*="dark-bg"] .card {
  background: rgba(255, 255, 255, 0.04) !important;
  border-color: rgba(255, 255, 255, 0.12) !important;
  color: rgba(255, 255, 255, 0.92) !important;
}
</style>
</head>
<body>
<div class="card">
<div class="brand"><div class="brand-icon"><i class="mds-lu" data-lucide="plus"></i></div><h1>MD Scholars</h1><div class="subtitle">Set Your Password</div></div>
<h2>Welcome!</h2>
<p class="hint">You've been accepted to MD Scholars. Set a password to activate your student account and access your course materials.</p>
<div class="msg" id="msg"></div>
<form id="pwdForm">
<div class="field">
<label for="pwd1">New password</label>
<input autocomplete="new-password" id="pwd1" minlength="8" placeholder="At least 8 characters" required="" type="password"/>
</div>
<div class="field">
<label for="pwd2">Confirm new password</label>
<input autocomplete="new-password" id="pwd2" minlength="8" placeholder="Type it again" required="" type="password"/>
</div>
<button class="submit" id="submitBtn" type="submit">Set password →</button>
<div class="req">Choose something at least 8 characters, mixing letters and numbers.</div>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
    const SUPABASE_URL = 'https://nygeinaoevzyptkgchqb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cLhwAVFe-oh-9r80fDvZmw_LVC5SKKR';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMsg(type, text) {
      const m = document.getElementById('msg');
      m.className = 'msg ' + type; m.textContent = text; m.style.display = 'block';
    }

    async function initListeners() {
      // Supabase Auth's invite/reset flow lands here with a recovery token in the URL fragment.
      // The Supabase client auto-detects the token from the URL on load.

      // Wait a beat for the SDK to process the URL fragment, then verify we actually got a session.
      await new Promise(r => setTimeout(r, 250));
      const { data: { session } } = await sb.auth.getSession();
      const hash = window.location.hash || '';
      const hasInviteHash = hash.includes('access_token=') || hash.includes('type=invite') || hash.includes('type=recovery');

      if (!session && !hasInviteHash) {
        // No session AND no token in URL — they probably landed here directly without the email link.
        showMsg('error', 'Your invite link is missing or expired. Open the most recent "Confirm your invitation" email from MD Scholars and click the link again — or use "Forgot password?" on the login page to request a fresh link.');
        document.getElementById('submitBtn').disabled = true;
        return;
      }

      // Listen for the PASSWORD_RECOVERY / SIGNED_IN events from the URL fragment
      sb.auth.onAuthStateChange((event, sess) => {
        if (sess) {
          // Session established from the magic link
          const info = document.getElementById('msg');
          if (info.style.display !== 'block') {
            showMsg('info', 'Link verified. Choose your new password below.');
          }
        }
      });

      document.getElementById('pwdForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('pwd1').value;
        const p2 = document.getElementById('pwd2').value;
        if (p1 !== p2) { showMsg('error', 'Passwords do not match.'); return; }
        if (p1.length < 8) { showMsg('error', 'Password must be at least 8 characters.'); return; }
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Saving…';

        // Make sure we have a session before calling updateUser
        const { data: { session: liveSession } } = await sb.auth.getSession();
        if (!liveSession) {
          showMsg('error', 'Your invite link has expired or already been used. Please use "Forgot password?" on the login page to get a fresh link.');
          btn.disabled = false; btn.textContent = 'Set password →';
          return;
        }

        const { error } = await sb.auth.updateUser({ password: p1 });
        if (error) {
          showMsg('error', 'Could not save password: ' + error.message + ' — try requesting a fresh password-reset email from the login page.');
          btn.disabled = false; btn.textContent = 'Set password →';
          return;
        }
        showMsg('success', 'Password set! Redirecting to your student dashboard…');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initListeners); else initListeners();
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<script id="mds-lucide-init">
(function(){
  function luminance(rgbStr){
    var m = rgbStr && rgbStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (!m) return null;
    var r = +m[1], g = +m[2], b = +m[3];
    return (0.2126*r + 0.7152*g + 0.0722*b) / 255;
  }
  function ancestorBg(el){
    var node = el.parentElement;
    while (node && node !== document.body){
      var bg = getComputedStyle(node).backgroundColor;
      var m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d\.]+))?\)/);
      if (m){
        var alpha = m[4] === undefined ? 1 : parseFloat(m[4]);
        if (alpha > 0.15) return bg;
      }
      var inline = node.getAttribute && node.getAttribute("style") || "";
      if (/#001F3F|#001A35|#002040|#002d5a|var\(--navy/i.test(inline)) return "rgb(0,31,63)";
      node = node.parentElement;
    }
    return getComputedStyle(document.body).backgroundColor || "rgb(255,255,255)";
  }
  function fixIconContrast(){
    var icons = document.querySelectorAll(".mds-lu");
    icons.forEach(function(icon){
      var lum = luminance(ancestorBg(icon));
      if (lum === null) return;
      if (lum < 0.45){
        icon.style.color = "#ffffff";
        icon.style.stroke = "#ffffff";
      } else {
        icon.style.removeProperty("color");
        icon.style.removeProperty("stroke");
      }
    });
  }
  function init(){
    if (window.lucide && window.lucide.createIcons){
      window.lucide.createIcons();
      requestAnimationFrame(fixIconContrast);
      setTimeout(fixIconContrast, 200);
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
  window.mdsRefreshIcons = init;
  window.mdsFixIconContrast = fixIconContrast;
  window.addEventListener("load", fixIconContrast);
})();
</script>
</body>
</html>
