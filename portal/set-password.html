<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Set Your Password — MD Scholars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy: #001F3F; --teal: #134E4A; --teal-bright: #0d9488; --teal-light: #14b8a6; --cream: #f8f5ef; --white: #ffffff; --gray-200: #e2e8f0; --gray-400: #94a3b8; --gray-600: #475569; --text: #0f172a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; color: var(--text); background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .card { background: var(--white); border-radius: 16px; padding: 2.5rem; max-width: 460px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .brand { text-align: center; margin-bottom: 1.5rem; }
  .brand-icon { width: 56px; height: 56px; margin: 0 auto 1rem; background: linear-gradient(135deg, var(--teal), var(--teal-bright)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; }
  .brand h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--navy); }
  .brand .subtitle { font-size: 0.78rem; color: var(--gray-600); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.25rem; }
  h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--navy); margin-bottom: 0.5rem; }
  .hint { color: var(--gray-600); font-size: 0.95rem; margin-bottom: 1.5rem; line-height: 1.5; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--navy); margin-bottom: 0.4rem; }
  .field input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
  .field input:focus { outline: none; border-color: var(--teal-bright); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
  .submit { width: 100%; background: linear-gradient(135deg, var(--teal-bright), var(--teal-light)); color: var(--white); padding: 0.85rem 1rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 0.5rem; }
  .submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
  .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .msg.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
  .req { font-size: 0.8rem; color: var(--gray-600); margin-top: 0.5rem; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="brand-icon">⚕️</div><h1>MD Scholars</h1><div class="subtitle">Set Your Password</div></div>
    <h2>Welcome!</h2>
    <p class="hint">You've been accepted to MD Scholars. Set a password to activate your student account and access your course materials.</p>
    <div id="msg" class="msg"></div>
    <form id="pwdForm">
      <div class="field">
        <label for="pwd1">New password</label>
        <input type="password" id="pwd1" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
      </div>
      <div class="field">
        <label for="pwd2">Confirm new password</label>
        <input type="password" id="pwd2" autocomplete="new-password" required minlength="8" placeholder="Type it again">
      </div>
      <button type="submit" class="submit" id="submitBtn">Set password →</button>
      <div class="req">Choose something at least 8 characters, mixing letters and numbers.</div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://nygeinaoevzyptkgchqb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55Z2VpbmFvZXZ6eXB0a2djaHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NTY5OTgsImV4cCI6MjA5MDIzMjk5OH0.73LgchISCs4puQJ1-RKIjepKZeZKXTzopkV-8L8btWQ';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMsg(type, text) {
      const m = document.getElementById('msg');
      m.className = 'msg ' + type; m.textContent = text; m.style.display = 'block';
    }

    async function initListeners() {
      // Supabase Auth's invite/reset flow lands here with a recovery token in the URL fragment.
      // The Supabase client auto-detects the token from the URL on load.

      // Wait a beat for the SDK to process the URL fragment, then verify we actually got a session.
      await new Promise(r => setTimeout(r, 250));
      const { data: { session } } = await sb.auth.getSession();
      const hash = window.location.hash || '';
      const hasInviteHash = hash.includes('access_token=') || hash.includes('type=invite') || hash.includes('type=recovery');

      if (!session && !hasInviteHash) {
        // No session AND no token in URL — they probably landed here directly without the email link.
        showMsg('error', 'Your invite link is missing or expired. Open the most recent "Confirm your invitation" email from MD Scholars and click the link again — or use "Forgot password?" on the login page to request a fresh link.');
        document.getElementById('submitBtn').disabled = true;
        return;
      }

      // Listen for the PASSWORD_RECOVERY / SIGNED_IN events from the URL fragment
      sb.auth.onAuthStateChange((event, sess) => {
        if (sess) {
          // Session established from the magic link
          const info = document.getElementById('msg');
          if (info.style.display !== 'block') {
            showMsg('info', 'Link verified. Choose your new password below.');
          }
        }
      });

      document.getElementById('pwdForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('pwd1').value;
        const p2 = document.getElementById('pwd2').value;
        if (p1 !== p2) { showMsg('error', 'Passwords do not match.'); return; }
        if (p1.length < 8) { showMsg('error', 'Password must be at least 8 characters.'); return; }
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Saving…';

        // Make sure we have a session before calling updateUser
        const { data: { session: liveSession } } = await sb.auth.getSession();
        if (!liveSession) {
          showMsg('error', 'Your invite link has expired or already been used. Please use "Forgot password?" on the login page to get a fresh link.');
          btn.disabled = false; btn.textContent = 'Set password →';
          return;
        }

        const { error } = await sb.auth.updateUser({ password: p1 });
        if (error) {
          showMsg('error', 'Could not save password: ' + error.message + ' — try requesting a fresh password-reset email from the login page.');
          btn.disabled = false; btn.textContent = 'Set password →';
          return;
        }
        showMsg('success', 'Password set! Redirecting to your student dashboard…');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initListeners); else initListeners();
  </script>
</body>
</html>
