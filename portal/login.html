<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Student Portal — MD Scholars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #001F3F;
    --teal: #134E4A;
    --teal-bright: #0d9488;
    --teal-light: #14b8a6;
    --gold: #c9a84c;
    --cream: #f8f5ef;
    --white: #ffffff;
    --gray-100: #f4f6f8;
    --gray-200: #e2e8f0;
    --gray-400: #94a3b8;
    --gray-600: #475569;
    --text: #0f172a;
    --danger: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .login-card { background: var(--white); border-radius: 16px; padding: 2.5rem 2.5rem 2rem; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .brand { text-align: center; margin-bottom: 1.5rem; }
  .brand-icon { width: 56px; height: 56px; margin: 0 auto 1rem; background: linear-gradient(135deg, var(--teal), var(--teal-bright)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; }
  .brand h1 { font-family: 'Newsreader', serif; font-size: 1.6rem; color: var(--navy); }
  .brand .subtitle { font-size: 0.8rem; color: var(--gray-600); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 0.25rem; }
  h2 { font-family: 'Newsreader', serif; font-size: 1.4rem; color: var(--navy); margin-bottom: 0.25rem; text-align: center; }
  .hint { text-align: center; color: var(--gray-600); font-size: 0.9rem; margin-bottom: 1.75rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--navy); margin-bottom: 0.4rem; }
  .field input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 0.95rem; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
  .field input:focus { outline: none; border-color: var(--teal-bright); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
  .submit { width: 100%; background: linear-gradient(135deg, var(--teal-bright), var(--teal-light)); color: var(--white); padding: 0.85rem 1rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: opacity 0.2s; margin-top: 0.5rem; }
  .submit:hover { opacity: 0.92; }
  .submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .alt-actions { text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--gray-600); }
  .alt-actions a { color: var(--teal-bright); text-decoration: none; font-weight: 600; }
  .alt-actions a:hover { text-decoration: underline; }
  .msg { padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
  .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .msg.info { background: #f0f9f8; color: var(--navy); border: 1px solid #99f6e4; }
  .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; }
  .footer-link a { color: var(--gray-400); text-decoration: none; }
  .footer-link a:hover { color: var(--gray-600); }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon"><img src="../logo.png" alt="MD Scholars logo" style="width:100%;height:100%;object-fit:contain;display:block;"></div>
      <h1>MD Scholars</h1>
      <div class="subtitle">Student Portal</div>
    </div>

    <h2>Sign in</h2>
    <p class="hint">Use the email tied to your accepted application.</p>

    <div id="msg" class="msg"></div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="submit" id="submitBtn">Sign in →</button>
    </form>

    <div class="alt-actions">
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>

    <div class="footer-link">
      <a href="../index.html">← Back to mdscholars.com</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://nygeinaoevzyptkgchqb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cLhwAVFe-oh-9r80fDvZmw_LVC5SKKR';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMsg(type, text) {
      const m = document.getElementById('msg');
      m.className = 'msg ' + type;
      m.textContent = text;
      m.style.display = 'block';
    }

    // Check both the access view AND the underlying student_profiles row for fee_status.
    async function loadAccessAndFee() {
      const accessP = sb.from('student_access').select('is_active, days_remaining, full_name').maybeSingle();
      const profileP = sb.from('student_profiles').select('fee_status, application_id, dropped_at, drop_reason').maybeSingle();
      const [accessRes, profileRes] = await Promise.all([accessP, profileP]);
      // If we have an application_id, also check whether the applicant is a minor and whether parental consent has been signed.
      let consent = null;
      let application = null;
      if (profileRes.data && profileRes.data.application_id) {
        const appP = sb.from('applications')
          .select('date_of_birth, program_track, applicant_role, education_level, parent_email')
          .eq('id', profileRes.data.application_id)
          .maybeSingle();
        const conP = sb.from('parental_consents')
          .select('status, signed_at')
          .eq('application_id', profileRes.data.application_id)
          .maybeSingle();
        const [appRes, conRes] = await Promise.all([appP, conP]);
        application = appRes.data;
        consent = conRes.data;
      }
      return {
        access: accessRes.data,
        accessErr: accessRes.error,
        profile: profileRes.data,
        profileErr: profileRes.error,
        application: application,
        consent: consent,
      };
    }

    function isPaidOrFree(profile) {
      // profile.fee_status: 'paid' | 'unpaid' | 'free' | 'dropped' | null
      if (!profile) return false;
      if (profile.dropped_at) return false;       // dropped students can't log in
      const s = (profile.fee_status || '').toLowerCase();
      return s === 'paid' || s === 'free';
    }

    function isDropped(profile) {
      return !!(profile && profile.dropped_at);
    }

    function isMinorApplicant(application) {
      if (!application) return false;
      const dob = application.date_of_birth ? new Date(application.date_of_birth) : null;
      let age = null;
      if (dob && !isNaN(dob.getTime())) {
        const now = new Date();
        age = now.getFullYear() - dob.getFullYear();
        const m = now.getMonth() - dob.getMonth();
        if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
      }
      const role = (application.applicant_role || '').toLowerCase();
      const edu = (application.education_level || '').toLowerCase();
      return (age !== null && age < 18) ||
             application.program_track === 'future-physician' ||
             role === 'hs' ||
             edu.indexOf('high school') !== -1 ||
             edu.indexOf('hs') !== -1;
    }

    function hasParentalConsent(consent) {
      return !!(consent && (consent.status === 'signed' || consent.signed_at));
    }

    async function initListeners() {
      // ── TEST STUDENT AUTO-LOGIN ──
      // Admin panel opens login.html?testmode=1&e=<test-student-email>. We sign in with the
      // shared internal password and land on the dashboard with a banner. Real students
      // never hit this branch because their emails never match the test-*@mdscholars.com pattern.
      // AWAITED to prevent race with the "session exists → redirect" block below.
      try {
        const params = new URLSearchParams(location.search);
        if (params.get('testmode') === '1') {
          const email = (params.get('e') || '').trim();
          if (email.startsWith('test-') && email.endsWith('@mdscholars.com')) {
            showMsg('info', 'Entering Test Student View as ' + email + '…');
            const { data: s } = await sb.auth.getSession();
            if (s.session && s.session.user.email !== email) {
              await sb.auth.signOut();
            }
            const { error } = await sb.auth.signInWithPassword({ email, password: 'MDScholarsTest2026!' });
            if (error) {
              showMsg('error', 'Test login failed: ' + error.message + ' — try Provision from admin.');
              return;
            }
            window.location.href = 'dashboard.html';
            return;
          }
        }
      } catch (e) { console.error('test-mode auto-login error', e); }

      // If already signed in AND has a student profile that's active AND paid/free, send straight to dashboard.
      sb.auth.getSession().then(async ({ data }) => {
        if (data.session) {
          // Test students bypass all gates
          if (data.session.user.email && data.session.user.email.startsWith('test-') && data.session.user.email.endsWith('@mdscholars.com')) {
            window.location.href = 'dashboard.html';
            return;
          }
          const r = await loadAccessAndFee();
          const consentOk = !isMinorApplicant(r.application) || hasParentalConsent(r.consent);
          if (r.access && r.access.is_active && isPaidOrFree(r.profile) && consentOk) {
            window.location.href = 'dashboard.html';
          }
        }
      });

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Signing in…';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          showMsg('error', error.message || 'Sign-in failed. Please check your email and password.');
          btn.disabled = false; btn.textContent = 'Sign in →';
          return;
        }
        // Gate 1: must have a student profile (i.e. an accepted application)
        const r = await loadAccessAndFee();
        if (r.accessErr || !r.access) {
          await sb.auth.signOut();
          showMsg('error', 'Your account is not associated with an active MD Scholars cohort. Please contact contact@mdscholars.com if you believe this is an error.');
          btn.disabled = false; btn.textContent = 'Sign in →';
          return;
        }
        if (!r.access.is_active) {
          await sb.auth.signOut();
          showMsg('error', 'Your course access has ended. Please contact support@mdscholars.com if you need an extension.');
          btn.disabled = false; btn.textContent = 'Sign in →';
          return;
        }
        // Gate: dropped students can't log in
        if (isDropped(r.profile)) {
          await sb.auth.signOut();
          showMsg('error', 'This account has been withdrawn from the program. If you believe this is in error, please email support@mdscholars.com.');
          btn.disabled = false; btn.textContent = 'Sign in →';
          return;
        }
        // Gate: minors must have a signed parental consent on file before portal access
        if (isMinorApplicant(r.application) && !hasParentalConsent(r.consent)) {
          await sb.auth.signOut();
          showMsg('error', 'Parental consent is required before portal access for students under 18. Please ask your parent or guardian to check their email for the consent form we sent (or email support@mdscholars.com to have it re-sent).');
          btn.disabled = false; btn.textContent = 'Sign in →';
          return;
        }
        // Gate 2: payment must be marked paid or free
        if (!isPaidOrFree(r.profile)) {
          await sb.auth.signOut();
          showMsg('error', 'Your application hasn’t been marked paid yet. Once we record your payment (typically within 1–2 business days of your transfer arriving) we’ll email you and you’ll be able to sign in here. Questions about billing? Email support@mdscholars.com.');
          btn.disabled = false; btn.textContent = 'Sign in →';
          return;
        }
        // Success — record login + redirect
        sb.from('student_profiles').update({ last_login_at: new Date().toISOString() }).eq('auth_user_id', data.user.id).then(() => {});
        window.location.href = 'dashboard.html';
      });

      document.getElementById('forgotLink').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) { showMsg('error', 'Enter your email above first, then click Forgot password.'); return; }
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/portal/set-password.html' });
        if (error) { showMsg('error', error.message); return; }
        showMsg('info', 'If an account exists for this email, a password reset link is on its way.');
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initListeners); else initListeners();
  </script>
</body>
</html>
