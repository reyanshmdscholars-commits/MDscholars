<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
<title>Mentor Portal — MD Scholars</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  :root {
    --navy: #001F3F; --teal: #134E4A; --teal-bright: #0d9488; --teal-light: #14b8a6;
    --gold: #c9a84c; --cream: #f8f5ef; --white: #ffffff;
    --gray-100: #f4f6f8; --gray-200: #e2e8f0; --gray-400: #94a3b8; --gray-600: #475569;
    --text: #0f172a; --danger: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; color: var(--text); background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .login-card { background: var(--white); border-radius: 16px; padding: 2.5rem 2.5rem 2rem; max-width: 420px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  .brand { text-align: center; margin-bottom: 1.5rem; }
  .brand-icon { width: 56px; height: 56px; margin: 0 auto 1rem; background: linear-gradient(135deg, var(--navy), var(--teal-bright)); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; color: white; }
  .brand h1 { font-family: 'Newsreader', serif; font-size: 1.6rem; color: var(--navy); }
  .brand .subtitle { font-size: 0.78rem; color: var(--gold); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 0.3rem; font-weight: 600; }
  h2 { font-family: 'Newsreader', serif; font-size: 1.4rem; color: var(--navy); margin-bottom: 0.25rem; text-align: center; }
  .hint { text-align: center; color: var(--gray-600); font-size: 0.9rem; margin-bottom: 1.75rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--navy); margin-bottom: 0.4rem; }
  .field input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 0.95rem; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s; }
  .field input:focus { outline: none; border-color: var(--teal-bright); box-shadow: 0 0 0 3px rgba(20,184,166,0.15); }
  .submit { width: 100%; background: linear-gradient(135deg, var(--navy), var(--teal-bright)); color: var(--white); padding: 0.85rem 1rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: opacity 0.2s; margin-top: 0.5rem; }
  .submit:hover { opacity: 0.92; }
  .submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .alt-actions { text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: var(--gray-600); }
  .alt-actions a { color: var(--teal-bright); text-decoration: none; font-weight: 600; }
  .alt-actions a:hover { text-decoration: underline; }
  .msg { padding: 0.85rem 1rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
  .msg.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .msg.info { background: #f0f9f8; color: var(--navy); border: 1px solid #99f6e4; }
  .footer-link { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; }
  .footer-link a { color: var(--gray-400); text-decoration: none; }
  .footer-link a:hover { color: var(--gray-600); }
  .switch-link { text-align: center; font-size: 0.85rem; color: var(--gray-600); margin-top: 0.75rem; }
  .switch-link a { color: var(--teal-bright); text-decoration: none; font-weight: 600; }
</style>
  <style id="mds-lucide-style">
.mds-lu { display: inline-block; width: 1.05em; height: 1.05em; stroke-width: 1.75; vertical-align: -0.18em; margin-right: 0.4em; color: currentColor; flex-shrink: 0; }
.mds-lu:last-child { margin-right: 0; }
.feature-icon .mds-lu, .service-icon .mds-lu, .stat-icon .mds-lu,
.card-icon .mds-lu, .program-icon .mds-lu, .step-icon .mds-lu,
.trust-icon .mds-lu, .cta-icon .mds-lu, .icon-badge .mds-lu,
.tab-icon .mds-lu, .nav-item-icon .mds-lu { width: 60%; height: 60%; margin: 0; stroke-width: 1.5; }
</style>
  <style id="mds-canonical-contrast">
/* ═══ CONTRAST FIX — light icons/buttons on dark surfaces ═══ */

/* Icons on dark surfaces (nav, footer, dark hero, CTA bands, dashboard sidebar) render white */
body > nav .mds-lu,
body > footer .mds-lu,
body footer .mds-lu,
body .hero .mds-lu,
body .hero-section .mds-lu,
body section.section-navy .mds-lu,
body section.dark .mds-lu,
body section[class*="cta"] .mds-lu,
body [class*="dark-bg"] .mds-lu,
body [class*="bg-navy"] .mds-lu,
body [class*="bg-dark"] .mds-lu,
body [style*="background:#001F3F" i] .mds-lu,
body [style*="background: #001F3F" i] .mds-lu,
body [style*="background-color:#001F3F" i] .mds-lu,
body [style*="background:var(--navy)" i] .mds-lu,
body [style*="background: var(--navy)" i] .mds-lu,
body [style*="background:var(--navy-mid)" i] .mds-lu,
body [style*="background:#0f172a" i] .mds-lu,
body [style*="background: #0f172a" i] .mds-lu,
body [style*="background:#001a35" i] .mds-lu,
body [style*="background:#002d5a" i] .mds-lu,
body .sidebar .mds-lu,
body .dashboard-sidebar .mds-lu,
body aside.dark .mds-lu {
  color: #ffffff !important;
  stroke: #ffffff !important;
}

/* Icon container circles on dark surfaces need light backgrounds */
body > footer .feature-icon, body > footer .service-icon, body > footer .card-icon,
body > footer .program-icon, body > footer .step-icon, body > footer .stat-icon,
body > footer .trust-icon, body > footer .icon-badge, body > footer .cta-icon,
body .hero .feature-icon, body .hero .service-icon, body .hero .card-icon,
body .hero .program-icon, body .hero .step-icon, body .hero .stat-icon,
body .hero .trust-icon, body .hero .icon-badge, body .hero .cta-icon,
body section.section-navy .feature-icon, body section.dark .feature-icon,
body section[class*="cta"] .feature-icon,
body [class*="dark-bg"] .feature-icon, body [class*="dark-bg"] .stat-icon,
body [class*="bg-navy"] .feature-icon, body [class*="bg-navy"] .stat-icon {
  background: rgba(255, 255, 255, 0.12) !important;
  color: #ffffff !important;
  border: 1px solid rgba(255, 255, 255, 0.18) !important;
}
body > footer .feature-icon .mds-lu,
body > footer .service-icon .mds-lu,
body .hero .feature-icon .mds-lu,
body .hero .stat-icon .mds-lu,
body section.section-navy .feature-icon .mds-lu,
body [class*="dark-bg"] .feature-icon .mds-lu {
  color: #ffffff !important;
  stroke: #ffffff !important;
}

/* Buttons — ensure primary CTAs always readable */
body .btn-primary, body a.btn-primary, body button.btn-primary,
body .btn-teal, body a.btn-teal, body button.btn-teal,
body .btn-cta, body a.btn-cta, body button.btn-cta,
body .cta-button, body a.cta-button, body button.cta-button {
  background: #0d9488 !important;
  color: #ffffff !important;
  border: 1px solid #0d9488 !important;
}
body .btn-primary .mds-lu, body .btn-teal .mds-lu, body .btn-cta .mds-lu {
  color: #ffffff !important;
  stroke: #ffffff !important;
}

/* Ghost / outline buttons on DARK surfaces — light border + light text */
body > nav .btn-ghost, body > nav a.btn-ghost, body > nav button.btn-ghost,
body > footer .btn-ghost, body > footer a.btn-ghost, body > footer button.btn-ghost,
body .hero .btn-ghost, body .hero a.btn-ghost, body .hero button.btn-ghost,
body section.section-navy .btn-ghost,
body section[class*="cta"] .btn-ghost,
body [class*="dark-bg"] .btn-ghost, body [class*="bg-navy"] .btn-ghost {
  background: rgba(255, 255, 255, 0.05) !important;
  color: #ffffff !important;
  border: 1.5px solid rgba(255, 255, 255, 0.55) !important;
  backdrop-filter: blur(4px);
}
body > nav .btn-ghost:hover, body > footer .btn-ghost:hover, body .hero .btn-ghost:hover,
body section.section-navy .btn-ghost:hover, body [class*="dark-bg"] .btn-ghost:hover {
  background: rgba(255, 255, 255, 0.14) !important;
  color: #ffffff !important;
  border-color: rgba(255, 255, 255, 0.85) !important;
}

/* Nav links / footer links — text is already white but ensure inline icons are too */
body > nav a .mds-lu, body > nav a i, body > footer a .mds-lu {
  color: currentColor !important;
  stroke: currentColor !important;
}

/* Any text-in-hero elements that were dark by inheritance */
body .hero h1, body .hero h2, body .hero p, body .hero .hero-sub,
body section.section-navy h1, body section.section-navy h2, body section.section-navy p,
body section.section-navy .section-title {
  color: #ffffff !important;
}
body .hero .section-label, body section.section-navy .section-label {
  color: #14b8a6 !important;
  border-bottom-color: #c9a84c !important;
}

/* Trust pills / feature pills on dark backgrounds */
body .hero .trust-pill, body .hero .feature-pill,
body section.section-navy .trust-pill, body section.section-navy .feature-pill,
body [class*="dark-bg"] .trust-pill {
  background: rgba(255, 255, 255, 0.08) !important;
  color: #ffffff !important;
  border-color: rgba(255, 255, 255, 0.18) !important;
}
body .hero .trust-pill::before, body section.section-navy .trust-pill::before {
  color: #14b8a6 !important;
}

/* Cards that sit on a dark section (uncommon but happens) */
body section.section-navy .card, body section.section-navy .feature-card,
body [class*="dark-bg"] .card {
  background: rgba(255, 255, 255, 0.04) !important;
  border-color: rgba(255, 255, 255, 0.12) !important;
  color: rgba(255, 255, 255, 0.92) !important;
}
</style>
</head>
<body>
<div class="login-card">
<div class="brand">
<div class="brand-icon"><i class="mds-lu" data-lucide="stethoscope"></i></div>
<h1>MD Scholars</h1>
<div class="subtitle">Mentor Portal</div>
</div>
<h2>Sign in</h2>
<p class="hint">Faculty mentors only. Use the email Dr. Munigala invited.</p>
<div class="msg" id="msg"></div>
<form autocomplete="on" id="loginForm">
<div class="field">
<label for="email">Email</label>
<input autocomplete="username" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<div class="field">
<label for="password">Password</label>
<input autocomplete="current-password" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="submit" id="submitBtn" type="submit">Sign in →</button>
</form>
<div class="alt-actions">
<a href="#" id="forgotLink">Forgot password?</a>
</div>
<div class="switch-link">
      Looking for the student portal? <a href="login.html">Student sign in →</a>
</div>
<div class="footer-link">
<a href="../index.html">← Back to mdscholars.com</a>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
    const SUPABASE_URL = 'https://nygeinaoevzyptkgchqb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cLhwAVFe-oh-9r80fDvZmw_LVC5SKKR';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMsg(type, text) {
      const m = document.getElementById('msg');
      m.className = 'msg ' + type;
      m.textContent = text;
      m.style.display = 'block';
    }

    function initListeners() {
      // If already signed in AND has a mentor row, send to mentor dashboard
      sb.auth.getSession().then(async ({ data }) => {
        if (data.session) {
          const { data: m } = await sb.from('mentors').select('id, status').eq('auth_user_id', data.session.user.id).maybeSingle();
          if (m && (m.status === 'active' || m.status === 'invited')) {
            window.location.href = 'mentor-dashboard.html';
          }
        }
      });

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Signing in…';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          showMsg('error', error.message || 'Sign-in failed. Please check your email and password.');
          btn.disabled = false; btn.textContent = 'Sign in →';
          return;
        }
        // Gate: must have a mentors row
        const { data: m, error: mErr } = await sb.from('mentors').select('id, status, full_name').eq('auth_user_id', data.user.id).maybeSingle();
        if (mErr || !m) {
          await sb.auth.signOut();
          showMsg('error', 'This account is not registered as a mentor. If you believe this is an error, contact contact@mdscholars.com.');
          btn.disabled = false; btn.textContent = 'Sign in →';
          return;
        }
        if (m.status === 'inactive') {
          await sb.auth.signOut();
          showMsg('error', 'Your mentor account is currently inactive.');
          btn.disabled = false; btn.textContent = 'Sign in →';
          return;
        }
        // Promote to active if still 'invited'
        if (m.status === 'invited') {
          await sb.from('mentors').update({ status: 'active' }).eq('id', m.id);
        }
        window.location.href = 'mentor-dashboard.html';
      });

      document.getElementById('forgotLink').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) { showMsg('error', 'Enter your email above first, then click Forgot password.'); return; }
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/portal/set-password.html?role=mentor' });
        if (error) { showMsg('error', error.message); return; }
        showMsg('info', 'If an account exists for this email, a password reset link is on its way.');
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initListeners); else initListeners();
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<script id="mds-lucide-init">
(function(){
  function init(){ if (window.lucide && window.lucide.createIcons) window.lucide.createIcons(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  window.mdsRefreshIcons = init;
})();
</script>
</body>
</html>
